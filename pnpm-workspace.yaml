packages:
  - '.'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@sveltejs/adapter-node@6.0.0'
  - '@sveltejs/kit@3.0.0'
  - 'framer-motion@13.5.0'
  - 'motion-dom@13.5.0'
  - 'motion-utils@13.5.0'
  - 'motion@13.5.0'
  - 'vite@8.3.2'

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
